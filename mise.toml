[settings]
# rust-toolchain.toml is the Rust pin; this makes `mise install` honour it.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"cargo:tauri-cli" = "2.12.0"

[tasks.build]
description = "Build Tauri app for the current platform"
run = "cargo tauri build"

[tasks.dev]
description = "Run Tauri app in dev mode (host platform only)"
run = "cargo tauri dev"
